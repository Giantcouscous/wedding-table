<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Plan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f3; --bg3: #eeede9;
    --text: #1a1a19; --text2: #5f5e5a; --text3: #888780;
    --border: rgba(0,0,0,0.12); --border2: rgba(0,0,0,0.22);
    --info-bg: #e6f1fb; --info-text: #0c447c; --info-border: #85b7eb;
    --warn-bg: #faeeda; --warn-text: #633806;
    --danger-bg: #fcebeb; --danger-text: #a32d2d;
    --radius: 8px; --radius-lg: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c; --bg2: #2a2a28; --bg3: #333330;
      --text: #e8e6df; --text2: #a0a09a; --text3: #666660;
      --border: rgba(255,255,255,0.12); --border2: rgba(255,255,255,0.22);
      --info-bg: #0c447c; --info-text: #b5d4f4; --info-border: #185fa5;
      --warn-bg: #633806; --warn-text: #fac775;
      --danger-bg: #791f1f; --danger-text: #f7c1c1;
    }
  }
  body { background: var(--bg3); color: var(--text); padding: 1.5rem; min-height: 100vh; }
  h1 { font-size: 18px; font-weight: 500; margin-bottom: 1rem; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; }
  .toolbar label { font-size: 13px; color: var(--text2); }
  .toolbar input[type=number] { width: 52px; text-align: center; padding: 5px 6px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); font-size: 13px; }
  button { padding: 6px 14px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer; transition: background 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--bg2); }
  button.active { background: var(--warn-bg); border-color: var(--warn-text); color: var(--warn-text); }
  .hint { font-size: 13px; color: var(--text2); padding: 8px 12px; background: var(--bg2); border-radius: var(--radius); margin-bottom: 10px; display: none; }
  .hint.visible { display: block; }
  #canvas { position: relative; width: 100%; min-height: 560px; background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: auto; }
  #connectorSvg { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .table-group { position: absolute; cursor: grab; }
  .table-group:active { cursor: grabbing; }
  .table-rect { background: var(--bg2); border: 1.5px solid var(--border2); border-radius: 6px; position: absolute; display: flex; align-items: center; justify-content: center; }
  .table-label { font-size: 11px; font-weight: 500; color: var(--text3); pointer-events: none; }
  .seat { position: absolute; width: 32px; height: 32px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text3); text-align: center; line-height: 1.1; transition: background 0.15s; overflow: hidden; }
  .seat:hover { background: var(--bg2); border-color: var(--text3); }
  .seat.filled { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); font-size: 8px; font-weight: 500; }
  .edge-btn { position: absolute; background: var(--bg2); border: 1px dashed var(--border2); border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s; z-index: 10; font-size: 10px; color: var(--text3); }
  .edge-btn:hover { background: var(--info-bg); border-color: var(--info-border); color: var(--info-text); }
  .edge-btn.selected { background: var(--warn-bg); border-color: var(--warn-text); color: var(--warn-text); }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg); border: 0.5px solid var(--border2); border-radius: var(--radius-lg); padding: 1.5rem; width: 280px; }
  .modal p { font-weight: 500; margin-bottom: 12px; font-size: 15px; }
  .modal input { width: 100%; padding: 8px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius); background: var(--bg2); color: var(--text); font-size: 14px; margin-bottom: 12px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  @media print {
    body { padding: 0.5rem; background: white; }
    .toolbar, .hint, .edge-btn, button { display: none !important; }
    #canvas { border: none; min-height: auto; overflow: visible; }
  }
</style>
</head>
<body>
<h1>Table Plan</h1>

<div class="toolbar">
  <label>Seats — long sides</label>
  <input type="number" id="longSeats" min="1" max="10" value="3">
  <label>Short sides</label>
  <input type="number" id="shortSeats" min="0" max="6" value="1">
  <button onclick="addTable()"><i class="ti ti-table"></i> Add table</button>
  <button id="attachBtn" onclick="toggleAttach()"><i class="ti ti-link"></i> Link tables</button>
  <button id="deleteBtn" onclick="toggleDelete()"><i class="ti ti-trash"></i> Delete table</button>
  <button onclick="window.print()" style="margin-left:auto;"><i class="ti ti-printer"></i> Print / PDF</button>
</div>

<div class="hint" id="hint">
  <span id="hintText"></span>
</div>

<div id="canvas">
  <svg id="connectorSvg"></svg>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <p>Assign guest</p>
    <input type="text" id="guestInput" placeholder="Name (leave blank to clear)">
    <div class="modal-btns">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="saveGuest()">Save</button>
    </div>
  </div>
</div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const S   = 32;   // seat diameter
const GAP = 6;    // gap between seats in a row
const SEP = 8;    // gap between seat edge and table rect edge

// tableSize returns the bounding box dimensions and key offsets.
// The table group div IS exactly this size.
// Seats live OUTSIDE the rect, inside the group bounding box.
// Layout (short > 0):
//   [top seat row]  ← SEP above rect
//   [rect]
//   [bottom seat row] ← SEP below rect
// Left/right seats overlap vertically with the rect.
//
// The rect itself:
//   rectX = S + SEP          (room for left seats)
//   rectY = S + SEP          (room for top seats, if short>0)
//   rectW = long*(S+GAP)-GAP + 2*SEP   (seats span + padding)
//   rectH = max(short,1)*(S+GAP)-GAP + 2*SEP

function tableSize(t) {
  const cols = t.long;
  const rows = Math.max(t.short, 1);

  const rectW = cols * (S + GAP) - GAP + 2 * SEP;
  const rectH = rows * (S + GAP) - GAP + 2 * SEP;

  const rectX = S + SEP;          // left seat column + gap
  const rectY = (t.short > 0) ? S + SEP : SEP;  // top seat row + gap, or just padding

  const totalW = rectX + rectW + S + SEP;   // left + rect + right
  const totalH = rectY + rectH + (t.short > 0 ? S + SEP : SEP); // top + rect + bottom

  return { rectX, rectY, rectW, rectH, totalW, totalH, cols, rows };
}

// ─── State ───────────────────────────────────────────────────────────────────
let tables = [], count = 0, attachMode = false, deleteMode = false, pendingEdge = null, pendingModal = null;

// ─── Add table ───────────────────────────────────────────────────────────────
function addTable() {
  const long  = Math.max(1, parseInt(document.getElementById('longSeats').value)  || 2);
  const short = Math.max(0, parseInt(document.getElementById('shortSeats').value) || 0);
  const id    = ++count;
  const n     = tables.length;
  const t = {
    id, long, short,
    x: 60 + (n % 3) * 260,
    y: 60 + Math.floor(n / 3) * 220,
    seats: {},
    links: { top: false, bottom: false, left: false, right: false },
    linkedTo: []
  };
  tables.push(t);
  renderTable(t);
}

// ─── Render ──────────────────────────────────────────────────────────────────
function renderTable(t) {
  const old = document.getElementById('tg-' + t.id);
  if (old) old.remove();

  const { rectX, rectY, rectW, rectH, totalW, totalH, cols, rows } = tableSize(t);
  const canvas = document.getElementById('canvas');

  const g = document.createElement('div');
  g.id = 'tg-' + t.id;
  g.className = 'table-group';
  g.style.cssText = `left:${t.x}px;top:${t.y}px;width:${totalW}px;height:${totalH}px;`;
  if (deleteMode) {
    g.style.outline = '2px dashed var(--danger-text)';
    g.style.borderRadius = '6px';
    g.style.cursor = 'pointer';
    g.title = 'Click to delete this table';
    g.onclick = e => { e.stopPropagation(); deleteTable(t.id); };
  }

  // Table rect
  const rect = document.createElement('div');
  rect.className = 'table-rect';
  rect.style.cssText = `left:${rectX}px;top:${rectY}px;width:${rectW}px;height:${rectH}px;`;
  const lbl = document.createElement('span');
  lbl.className = 'table-label';
  lbl.textContent = 'T' + t.id;
  rect.appendChild(lbl);
  g.appendChild(rect);

  // ── Top seats (one per long column, above the rect) ──
  if (t.short > 0 && !t.links.top) {
    for (let c = 0; c < cols; c++) {
      const sx = rectX + SEP + c * (S + GAP);
      const sy = 0;
      addSeat(g, t, 'top', c, sx, sy);
    }
  }

  // ── Bottom seats ──
  if (t.short > 0 && !t.links.bottom) {
    for (let c = 0; c < cols; c++) {
      const sx = rectX + SEP + c * (S + GAP);
      const sy = rectY + rectH + SEP;
      addSeat(g, t, 'bottom', c, sx, sy);
    }
  }

  // ── Left seats (one per row, left of rect) ──
  if (!t.links.left) {
    for (let r = 0; r < rows; r++) {
      const sx = 0;
      const sy = rectY + SEP + r * (S + GAP);
      addSeat(g, t, 'left', r, sx, sy);
    }
  }

  // ── Right seats ──
  if (!t.links.right) {
    for (let r = 0; r < rows; r++) {
      const sx = rectX + rectW + SEP;
      const sy = rectY + SEP + r * (S + GAP);
      addSeat(g, t, 'right', r, sx, sy);
    }
  }

  // ── Edge buttons (attach mode only) ──
  if (attachMode) {
    ['top', 'bottom', 'left', 'right'].forEach(side => {
      if (t.links[side]) return;
      const eb = document.createElement('div');
      const sel = pendingEdge && pendingEdge.tid === t.id && pendingEdge.side === side;
      eb.className = 'edge-btn' + (sel ? ' selected' : '');

      // Place edge buttons on the table rect edges (not the outer seats)
      let es = '';
      const mx = rectX + rectW / 2;
      const my = rectY + rectH / 2;
      if (side === 'top')    es = `left:${mx - 12}px;top:${rectY - 16}px;width:24px;height:14px;`;
      if (side === 'bottom') es = `left:${mx - 12}px;top:${rectY + rectH + 2}px;width:24px;height:14px;`;
      if (side === 'left')   es = `left:${rectX - 16}px;top:${my - 12}px;width:14px;height:24px;`;
      if (side === 'right')  es = `left:${rectX + rectW + 2}px;top:${my - 12}px;width:14px;height:24px;`;

      eb.style.cssText = es;
      eb.innerHTML = '<i class="ti ti-link" style="font-size:10px;"></i>';
      eb.onclick = e => { e.stopPropagation(); clickEdge(t.id, side); };
      g.appendChild(eb);
    });
  }

  makeDraggable(g, t);
  canvas.appendChild(g);
  updateConnectors();
}

function addSeat(parent, t, side, idx, x, y) {
  const key = side + '_' + idx;
  const el = document.createElement('div');
  el.className = 'seat' + (t.seats[key] ? ' filled' : '');
  el.style.cssText = `left:${x}px;top:${y}px;`;
  el.textContent = t.seats[key] || '+';
  el.title = t.seats[key] || 'Assign guest';
  el.onclick = e => { e.stopPropagation(); openModal(t.id, key); };
  parent.appendChild(el);
}

// ─── Snap logic ──────────────────────────────────────────────────────────────
// When linking t2.side2 to t1.side1, move t2 so the two rect edges are flush.
// "Flush" means the rects touch with zero gap (no seat gap needed — seats on
// linked sides are already removed, so nothing pokes out there).
function snapTable(t1, side1, t2, side2) {
  const s1 = tableSize(t1);
  const s2 = tableSize(t2);

  // Absolute position of t1's rect edge
  const t1RectLeft   = t1.x + s1.rectX;
  const t1RectTop    = t1.y + s1.rectY;
  const t1RectRight  = t1RectLeft + s1.rectW;
  const t1RectBottom = t1RectTop  + s1.rectH;

  // We want t2's rect edge (side2) to be flush with t1's rect edge (side1).
  // Compute where t2.x / t2.y should be.

  if (side1 === 'right' && side2 === 'left') {
    // t2's rect left edge → t1's rect right edge
    t2.x = t1RectRight - s2.rectX;
    // centre-align vertically
    t2.y = t1RectTop + s1.rectH / 2 - s2.rectY - s2.rectH / 2;
  } else if (side1 === 'left' && side2 === 'right') {
    t2.x = t1RectLeft - (s2.rectX + s2.rectW);
    t2.y = t1RectTop + s1.rectH / 2 - s2.rectY - s2.rectH / 2;
  } else if (side1 === 'bottom' && side2 === 'top') {
    t2.y = t1RectBottom - s2.rectY;
    t2.x = t1RectLeft + s1.rectW / 2 - s2.rectX - s2.rectW / 2;
  } else if (side1 === 'top' && side2 === 'bottom') {
    t2.y = t1RectTop - (s2.rectY + s2.rectH);
    t2.x = t1RectLeft + s1.rectW / 2 - s2.rectX - s2.rectW / 2;
  }
  // Clamp to canvas
  t2.x = Math.max(0, t2.x);
  t2.y = Math.max(0, t2.y);
}

// ─── Attach logic ────────────────────────────────────────────────────────────
function setHint(text) {
  const el = document.getElementById('hint');
  if (text) {
    document.getElementById('hintText').textContent = text;
    el.className = 'hint visible';
  } else {
    el.className = 'hint';
  }
}

function toggleAttach() {
  attachMode = !attachMode;
  if (attachMode) { deleteMode = false; document.getElementById('deleteBtn').className = ''; }
  pendingEdge = null;
  const btn = document.getElementById('attachBtn');
  btn.className = attachMode ? 'active' : '';
  btn.innerHTML = attachMode
    ? '<i class="ti ti-link-off"></i> Done linking'
    : '<i class="ti ti-link"></i> Link tables';
  setHint(attachMode ? 'Click a dashed edge button on a table, then click an edge on another table. It will snap flush — touching seats are removed.' : '');
  tables.forEach(renderTable);
}

function toggleDelete() {
  deleteMode = !deleteMode;
  if (deleteMode) { attachMode = false; pendingEdge = null; document.getElementById('attachBtn').className = ''; document.getElementById('attachBtn').innerHTML = '<i class="ti ti-link"></i> Link tables'; }
  const btn = document.getElementById('deleteBtn');
  btn.className = deleteMode ? 'active' : '';
  btn.style.color = deleteMode ? 'var(--danger-text)' : '';
  btn.style.borderColor = deleteMode ? 'var(--danger-text)' : '';
  btn.style.background = deleteMode ? 'var(--danger-bg)' : '';
  btn.innerHTML = deleteMode
    ? '<i class="ti ti-trash"></i> Cancel delete'
    : '<i class="ti ti-trash"></i> Delete table';
  setHint(deleteMode ? 'Click any table to delete it. Linked neighbours will be unlinked automatically.' : '');
  tables.forEach(renderTable);
}

function clickEdge(tid, side) {
  if (!pendingEdge) {
    pendingEdge = { tid, side };
    renderTable(tables.find(t => t.id === tid));
    return;
  }
  // Deselect same
  if (pendingEdge.tid === tid) {
    pendingEdge = null;
    tables.forEach(renderTable);
    return;
  }
  const t1 = tables.find(t => t.id === pendingEdge.tid);
  const t2 = tables.find(t => t.id === tid);
  const side1 = pendingEdge.side, side2 = side;

  // Mark links
  t1.links[side1] = true;
  t2.links[side2] = true;
  t1.linkedTo.push({ otherId: t2.id, mySide: side1, otherSide: side2 });
  t2.linkedTo.push({ otherId: t1.id, mySide: side2, otherSide: side1 });

  // Snap t2 flush against t1
  snapTable(t1, side1, t2, side2);

  pendingEdge = null;
  tables.forEach(renderTable);
}

// ─── Delete ──────────────────────────────────────────────────────────────────
function deleteTable(tid) {
  const t = tables.find(x => x.id === tid);
  if (t) {
    t.linkedTo.forEach(l => {
      const other = tables.find(x => x.id === l.otherId);
      if (other) {
        other.links[l.mySide] = false;
        other.linkedTo = other.linkedTo.filter(x => x.otherId !== tid);
        renderTable(other);
      }
    });
  }
  tables = tables.filter(x => x.id !== tid);
  const el2 = document.getElementById('tg-' + tid);
  if (el2) el2.remove();
  deleteMode = false;
  const dBtn = document.getElementById('deleteBtn');
  dBtn.className = ''; dBtn.style.color = ''; dBtn.style.borderColor = ''; dBtn.style.background = '';
  dBtn.innerHTML = '<i class="ti ti-trash"></i> Delete table';
  setHint('');
  updateConnectors();
}

// ─── Guest modal ─────────────────────────────────────────────────────────────
function openModal(tid, key) {
  pendingModal = { tid, key };
  const t = tables.find(x => x.id === tid);
  document.getElementById('guestInput').value = t.seats[key] || '';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('guestInput').focus(), 50);
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  pendingModal = null;
}
function saveGuest() {
  if (!pendingModal) return;
  const t = tables.find(x => x.id === pendingModal.tid);
  const v = document.getElementById('guestInput').value.trim();
  if (v) t.seats[pendingModal.key] = v;
  else delete t.seats[pendingModal.key];
  closeModal();
  renderTable(t);
}
document.getElementById('guestInput').addEventListener('keydown', e => {
  if (e.key === 'Enter')  saveGuest();
  if (e.key === 'Escape') closeModal();
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ─── Connectors (visual lines between linked tables) ─────────────────────────
function rectEdgeCentre(t, side) {
  const { rectX, rectY, rectW, rectH } = tableSize(t);
  const cx = t.x + rectX + rectW / 2;
  const cy = t.y + rectY + rectH / 2;
  if (side === 'top')    return { x: cx, y: t.y + rectY };
  if (side === 'bottom') return { x: cx, y: t.y + rectY + rectH };
  if (side === 'left')   return { x: t.x + rectX, y: cy };
  if (side === 'right')  return { x: t.x + rectX + rectW, y: cy };
}

function updateConnectors() {
  const svg = document.getElementById('connectorSvg');
  svg.innerHTML = '';
  const drawn = new Set();
  let maxX = 700, maxY = 500;

  tables.forEach(t => {
    const { totalW, totalH } = tableSize(t);
    maxX = Math.max(maxX, t.x + totalW + 40);
    maxY = Math.max(maxY, t.y + totalH + 40);

    (t.linkedTo || []).forEach(l => {
      const key = [t.id, l.otherId].sort().join('-');
      if (drawn.has(key)) return;
      drawn.add(key);
      const other = tables.find(x => x.id === l.otherId);
      if (!other) return;
      const p1 = rectEdgeCentre(t, l.mySide);
      const p2 = rectEdgeCentre(other, l.otherSide);
      // Draw a short indicator line across the join
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.setAttribute('stroke', 'rgba(180,160,100,0.6)');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-dasharray', '4 3');
      svg.appendChild(line);
    });
  });

  document.getElementById('canvas').style.minHeight = maxY + 'px';
  svg.setAttribute('width',  maxX);
  svg.setAttribute('height', maxY);
}

// ─── Drag ────────────────────────────────────────────────────────────────────
function makeDraggable(el, t) {
  el.addEventListener('mousedown', e => {
    if (['BUTTON', 'INPUT'].includes(e.target.tagName)
      || e.target.classList.contains('seat')
      || e.target.classList.contains('edge-btn')
      || e.target.classList.contains('delete-btn')
      || e.target.tagName === 'I') return;
    e.preventDefault();
    const ox = e.clientX - t.x, oy = e.clientY - t.y;

    // When dragging, also drag all tables linked (directly or transitively) to this one
    const group = getLinkedGroup(t.id);
    const origins = {};
    group.forEach(id => {
      const tb = tables.find(x => x.id === id);
      origins[id] = { ox: e.clientX - tb.x, oy: e.clientY - tb.y };
    });

    const mv = ev => {
      group.forEach(id => {
        const tb = tables.find(x => x.id === id);
        tb.x = Math.max(0, ev.clientX - origins[id].ox);
        tb.y = Math.max(0, ev.clientY - origins[id].oy);
        const el2 = document.getElementById('tg-' + id);
        if (el2) { el2.style.left = tb.x + 'px'; el2.style.top = tb.y + 'px'; }
      });
      updateConnectors();
    };
    const up = () => {
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
}

// BFS to get all tables in the same linked cluster
function getLinkedGroup(startId) {
  const visited = new Set([startId]);
  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    const t = tables.find(x => x.id === cur);
    if (!t) continue;
    (t.linkedTo || []).forEach(l => {
      if (!visited.has(l.otherId)) {
        visited.add(l.otherId);
        queue.push(l.otherId);
      }
    });
  }
  return [...visited];
}

// ─── Bootstrap ───────────────────────────────────────────────────────────────
addTable();
</script>
</body>
</html>
